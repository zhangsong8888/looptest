<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个轻量、支持键盘操作的计算器页面。">
  <title>计算器 · Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="计算器">
      <header class="calculator__header">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">±</span>
          <div>
            <h1 class="brand__title">计算器</h1>
            <p class="brand__subtitle">支持键盘与历史记录</p>
          </div>
        </div>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="切换深色模式" aria-pressed="false">
          <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </header>

      <div class="display">
        <div class="display__expression" id="expression" aria-hidden="true">0</div>
        <output class="display__result" id="result" role="status" aria-live="polite" aria-label="计算结果">0</output>
      </div>

      <div class="keypad" id="keypad">
        <button class="key key--utility" type="button" data-action="clear" aria-label="全部清空 (Esc)">AC</button>
        <button class="key key--utility" type="button" data-action="backspace" aria-label="退格 (Backspace)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 5H9L3 12l6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"></path>
            <path d="M17 9l-5 6M12 9l5 6"></path>
          </svg>
        </button>
        <button class="key key--utility" type="button" data-action="percent" aria-label="百分比 (%)">%</button>
        <button class="key key--operator" type="button" data-action="operator" data-value="÷" aria-label="除以">÷</button>

        <button class="key" type="button" data-action="digit" data-value="7">7</button>
        <button class="key" type="button" data-action="digit" data-value="8">8</button>
        <button class="key" type="button" data-action="digit" data-value="9">9</button>
        <button class="key key--operator" type="button" data-action="operator" data-value="×" aria-label="乘以">×</button>

        <button class="key" type="button" data-action="digit" data-value="4">4</button>
        <button class="key" type="button" data-action="digit" data-value="5">5</button>
        <button class="key" type="button" data-action="digit" data-value="6">6</button>
        <button class="key key--operator" type="button" data-action="operator" data-value="−" aria-label="减去">−</button>

        <button class="key" type="button" data-action="digit" data-value="1">1</button>
        <button class="key" type="button" data-action="digit" data-value="2">2</button>
        <button class="key" type="button" data-action="digit" data-value="3">3</button>
        <button class="key key--operator" type="button" data-action="operator" data-value="+" aria-label="加上">+</button>

        <button class="key" type="button" data-action="sign" aria-label="正负号切换">±</button>
        <button class="key" type="button" data-action="digit" data-value="0">0</button>
        <button class="key" type="button" data-action="dot" aria-label="小数点">.</button>
        <button class="key key--equals" type="button" data-action="equals" aria-label="等于 (Enter)">=</button>
      </div>

      <p class="hint">键盘：数字、<kbd>+</kbd> <kbd>−</kbd> <kbd>×</kbd> <kbd>÷</kbd>、<kbd>%</kbd>，<kbd>Enter</kbd> 计算，<kbd>Esc</kbd> 清空</p>
    </section>

    <aside class="history" aria-labelledby="history-title">
      <header class="history__header">
        <h2 class="history__title" id="history-title">历史记录</h2>
        <button class="text-button" id="clear-history" type="button">清空</button>
      </header>
      <ol class="history__list" id="history-list"></ol>
      <p class="history__empty" id="history-empty">还没有计算记录，算一道题试试。</p>
    </aside>
  </main>

  <script src="calculator.js"></script>
  <script src="app.js"></script>
</body>
</html>
